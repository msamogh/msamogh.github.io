<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.name }}{% else %}{{ site.name }} · LLM behavioral simulation{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"Amogh Mannekote","url":"{{ '/' | absolute_url }}",
   "image":"{{ '/images/dp.jpeg' | absolute_url }}","email":"mailto:msamogh@gmail.com",
   "jobTitle":"Researcher, LLM behavioral simulation",
   "alumniOf":{"@type":"CollegeOrUniversity","name":"University of Florida"},
   "knowsAbout":["LLM-based simulation of human behavior","Generative agent-based modeling","LLM agent evaluation","Synthetic data generation"],
   "sameAs":["https://scholar.google.com/citations?user=Vq8XjxAAAAAJ","https://github.com/msamogh","https://www.linkedin.com/in/msamogh","https://huggingface.co/msamogh"]}
  </script>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="{{ site.name }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ page.og_image | default: '/images/workbench/launcher.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav">
    <a class="nav-mark" href="{{ '/' | relative_url }}" aria-label="Home">
      <span class="mark">AM</span><span class="nav-name">Amogh Mannekote</span>
    </a>
    <nav>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/workbench/' | relative_url }}"{% if page.url == '/workbench/' %} aria-current="page"{% endif %}>Workbench</a>
      <a href="{{ '/images/resume.pdf' | relative_url }}" target="_blank" rel="noopener">CV</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="wrap foot-row">
      <span>© {{ site.time | date: '%Y' }} Amogh Mannekote. Built by hand and by agents.</span>
      <span class="foot-links">
        <a href="mailto:msamogh@gmail.com">Email</a>
        <a href="https://scholar.google.com/citations?user=Vq8XjxAAAAAJ&hl=en" target="_blank" rel="noopener">Scholar</a>
        <a href="https://github.com/msamogh" target="_blank" rel="noopener">GitHub</a>
        <a href="https://linkedin.com/in/msamogh" target="_blank" rel="noopener">LinkedIn</a>
      </span>
    </div>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
